format_version = 1
id = "bubble-showcase"
title = "Speech Bubble Rendering Fixture"
story = "scripts/story.vn"
entry = "first_light"
theme = "styles/lantern.toml"

# Only this independent fixture opts into bubble dialogue. The original
# Little Lantern game remains an unchanged, pure classic visual novel.
[dialogue]
default_surface = "bubble"

[dialogue.bubble]
max_width_percent = 58.0
padding = 18.0
corner_radius = 18.0
background = [0.035, 0.065, 0.12, 0.98]
border_color = [0.93, 0.79, 0.43, 1.0]

[backgrounds]
sunrise = "assets/backgrounds/sunrise.png"

[characters.pip.expressions]
cheerful = "assets/characters/pip-cheerful.png"

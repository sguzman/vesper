# Original production alpha. Dark-on-light ink is never a default.
ui_scale = 1.0
fade_seconds = 0.28
reveal_speed = "normal"

[font]
family = "DejaVu Sans"

[panel]
skin = "barrio"
background = [0.024, 0.030, 0.051, 0.96]
accent = [1.0, 0.75, 0.40, 1.0]
divider = [0.88, 0.73, 0.52, 0.71]
width_percent = 88.0
min_height = 212.0
padding = 19.0
gap = 8.0

[speaker]
size = 23.0
color = [1.0, 0.82, 0.54, 1.0]

[dialogue]
size = 25.0
color = [0.98, 0.96, 0.92, 1.0]

[choices]
size = 23.0
color = [0.98, 0.94, 0.84, 1.0]

[hint]
size = 16.0
color = [0.81, 0.82, 0.84, 1.0]

[feedback]
focus_seconds = 0.15
confirm_seconds = 0.14
cue_opacity = 0.42
cue_color = [1.0, 0.77, 0.43, 1.0]

# Author-owned reader hints in English. Engine key bindings remain unchanged.
[reader_hints]
narration = "Enter/Space: continue · H: history · F5/F9: save/load · P: pause · M: menu"
choices = "↑↓: choose · Enter/1–4: confirm · H: history · P: pause · M: menu"
ending = "↑↓: choose · Enter: confirm · R: replay · M: menu"
conversation = "Enter: continue · Q: leave · F5: save · F9: load"
conversation_choices = "↑↓: choose · Enter: confirm · Q: leave · F5/F9: save/load"

# Explicit English menu labels; the order and actions remain engine-owned.
# The key actions, ordering, and keyboard bindings remain engine-owned.
[menu_labels]
main = ["New Story", "Continue", "Quit", "Settings"]
pause = ["Resume", "Main Menu", "Quit", "Settings"]
ending = ["Play Again", "Main Menu", "Quit"]
main_title = "Main Menu"
pause_title = "Paused"
ending_title = "The End"
main_hint = "↑↓: choose · Enter: confirm · M: close · Esc: quit"
pause_hint = "↑↓: choose · Enter: confirm · P: resume · Esc: quit"

# Illustrated menu composition and native diegetic controls. Distinct
# frames, palettes and focus plaques; not just scenery behind generic rows.
[menu_skins.main]
panel_width_percent = 42.0
panel_offset_percent = 7.0
panel_opacity = 0.78
title_size = 27.0
button_height = 45.0
button_text_size = 19.0
button_gap = 7.0
centered = true
show_numbers = false
panel_color = [0.032, 0.058, 0.115, 1.0]
border_color = [0.93, 0.74, 0.41, 1.0]
title_color = [0.99, 0.87, 0.68, 1.0]
normal_fill = [0.051, 0.12, 0.21, 0.88]
selected_fill = [0.25, 0.17, 0.078, 0.98]
normal_text = [0.96, 0.89, 0.76, 1.0]
selected_text = [1.0, 0.96, 0.81, 1.0]

# Diegetic brass-and-navy button plaques, independent from backdrop art.
# Native menu hit targets, keyboard focus and number shortcuts remain engine-owned.
[menu_skins.pause]
panel_width_percent = 44.0
panel_offset_percent = 7.0
panel_opacity = 0.84
title_size = 30.0
button_height = 47.0
button_text_size = 20.0
button_gap = 8.0
centered = true
show_numbers = false
panel_color = [0.025, 0.052, 0.108, 1.0]
border_color = [0.9, 0.7, 0.37, 1.0]
title_color = [0.98, 0.86, 0.65, 1.0]
normal_fill = [0.04, 0.1, 0.19, 0.91]
selected_fill = [0.24, 0.17, 0.078, 0.98]
normal_text = [0.93, 0.86, 0.72, 1.0]
selected_text = [1.0, 0.96, 0.8, 1.0]


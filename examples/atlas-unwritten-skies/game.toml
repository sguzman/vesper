[panel_skins.parchment]
image = "assets/panels/celestial_dialogue.png"
insets = [160.0, 160.0, 94.0, 30.0]
slice_border = 28.0
transparent_background = true
compact_top_boost = 40.0
# Explicit protected writing region: no prose on the globe/ivy/compass/trim.
# Fractions are of the actual panel dimensions, not the viewport.
safe_area = [0.255, 0.23, 0.36, 0.37]
# The upper navy label is distinct from the parchment writing region.
# Horizontal fractions refer to the aspect-preserved left image cap,
# not the stretchable whole frame; vertical fractions refer to frame height.
speaker_area = [0.46, 0.15, 0.33, 0.16]
# [left, right, bottom]. Keep short help visually below body prose.
hint_area = [0.255, 0.23, 0.335]
# Dedicated bounded legend, away from the lower gold border and ornamental crest.
# [left, top, width, height] of the panel, independent of prose padding.
hint_region = [0.255, 0.65, 0.51, 0.11]

# Keep the globe, books and lantern at their original aspect ratio.
# Nine-region hinge: preserve the globe, blue titleplate, compass, lantern,
# and corner trims at a uniform scale. The 4px-wide horizontal infill crosses
# the straight border and plain parchment just right of the central ornaments.
# Vertical growth is isolated to the middle paper band (source y=395..420).
# This makes the extended areas simple infill instead of distorted motifs.
[panel_skins.parchment.horizontal_slices]
image_size = [1914.0, 820.0]
stretch_start = 1240.0
stretch_end = 1244.0
vertical_slices = [395.0, 420.0]
reference_height = 430.0

[ambient_actors.spark]
image = "assets/ambient/spark.png"
anchor = [0.13, 0.12]
scale = 1.2
opacity = 0.74
depth = 1.8
initially_visible = false
start_phase_seconds = 0.0
[ambient_actors.spark.motion]
waypoints = [[0.14, 0.10], [0.21, 0.18], [0.29, 0.11], [0.35, 0.19]]
period_seconds = 15.0
mode = "ping_pong"

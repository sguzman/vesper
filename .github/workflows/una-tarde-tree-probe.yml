name: Temporary source-import tree inspection
on:
  push:
    branches:
      - feat/una-tarde-source-import
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  base-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Print tree hashes for exact import parent
        shell: bash
        run: |
          git fetch --depth=1 origin main
          echo "SOURCE_IMPORT_MAIN_COMMIT=$(git rev-parse FETCH_HEAD)"
          echo "SOURCE_IMPORT_BASE_TREE=$(git show -s --format=%T FETCH_HEAD)"

name: Render Atlas menu illustrations
on:
  push:
    paths:
      - 'examples/atlas-unwritten-skies/assets/menus/*.svg'
      - '.github/workflows/atlas-menu-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install vector artwork renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin
      - name: Rasterize independent menu illustrations
        run: |
          mkdir -p examples/atlas-unwritten-skies/assets/menus
          for name in main pause settings; do
            rsvg-convert --width 1280 --height 720 --keep-aspect-ratio               --output "examples/atlas-unwritten-skies/assets/menus/${name}.png"               "examples/atlas-unwritten-skies/assets/menus/${name}.svg"
            file "examples/atlas-unwritten-skies/assets/menus/${name}.png"
          done
          for name in button-idle button-selected; do
            rsvg-convert --width 1024 --height 128 --output "examples/atlas-unwritten-skies/assets/menus/${name}.png" "examples/atlas-unwritten-skies/assets/menus/${name}.svg"
            file "examples/atlas-unwritten-skies/assets/menus/${name}.png"
          done
      - name: Commit rendered game assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/atlas-unwritten-skies/assets/menus/*.png
          if git diff --cached --quiet; then
            echo "Rendered menu PNGs are current"
          else
            git commit -m "Ship dedicated rendered Atlas menu backdrops"
            git push origin HEAD:main
          fi

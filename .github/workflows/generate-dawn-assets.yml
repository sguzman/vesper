name: Generate original Dawn Post Office assets
on:
  push:
    branches:
      - feature/vx10-dawn-post-office
    paths:
      - examples/dawn-post-office/tools/generate_assets.py
      - .github/workflows/generate-dawn-assets.yml
  workflow_dispatch:

# This workflow is temporary production tooling, not part of the runtime.
# It commits original raster images and PCM files to the feature branch once.
permissions:
  contents: write

jobs:
  render:
    if: github.ref == 'refs/heads/feature/vx10-dawn-post-office'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow in an isolated build environment
        run: |
          python -m venv /tmp/dawn-art-env
          /tmp/dawn-art-env/bin/python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Produce reproducible original art and audio
        run: /tmp/dawn-art-env/bin/python examples/dawn-post-office/tools/generate_assets.py
      - name: Validate raster sizes, transparent characters and PCM audio
        run: |
          /tmp/dawn-art-env/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import wave
          root=Path('examples/dawn-post-office/assets')
          bgs=list((root/'backgrounds').glob('*.png'))
          chars=list((root/'characters').glob('*.png'))
          waves=list((root/'audio').glob('*.wav'))
          assert len(bgs)==7 and len(chars)==9 and len(waves)==7, (len(bgs),len(chars),len(waves))
          for p in bgs:
              with Image.open(p) as im: assert im.size==(960,540)
          for p in chars:
              with Image.open(p) as im:
                  assert im.mode=='RGBA' and im.size==(320,500)
                  a=im.getchannel('A').getextrema()
                  assert a==(0,255),(p,a)
          for p in waves:
              with wave.open(str(p),'rb') as w:
                  assert w.getframerate()==16000 and w.getnchannels()==1 and w.getsampwidth()==2
                  assert w.getnframes()>1000
          print('7 original backgrounds, 9 transparent actor expressions, 7 original WAVs verified')
          PY
      - name: Commit generated binary assets without user intervention
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/dawn-post-office/assets/
          if ! git diff --cached --quiet; then
            git commit -m "assets(vx10): commit original illustrated backgrounds, expressions and audio"
            git push origin HEAD:feature/vx10-dawn-post-office
          else
            echo "Generated assets unchanged."
          fi

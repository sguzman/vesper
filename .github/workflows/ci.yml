name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format working copy
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy -p vesper-story -p vesper-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p vesper-story -p vesper-cli
      - name: Validate example
        run: cargo run -p vesper-cli -- check game/scripts/demo.vn
      - name: Reject malformed example with file and line
        run: |
          printf '@scene intro\nset x = invalid\n' > /tmp/vesper-invalid.vn
          if cargo run -p vesper-cli -- check /tmp/vesper-invalid.vn > /tmp/vesper-cli.log 2>&1; then
            echo 'invalid story unexpectedly passed'; exit 1
          fi
          grep -F '/tmp/vesper-invalid.vn:2:' /tmp/vesper-cli.log
  bevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build Bevy 0.20 player
        run: cargo build -p vesper-player
      - name: Start player under virtual X11 display
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=TERM 25s xvfb-run -a target/debug/vesper-player game/scripts/demo.vn > /tmp/vesper-start.log 2>&1
          result=$?
          set -e
          cat /tmp/vesper-start.log
          if [ "$result" -ne 124 ]; then
            echo "Player did not stay running during smoke test (exit: $result)"
            exit 1
          fi
          if grep -Ei 'panicked at|thread .* panicked|Unable to find a GPU' /tmp/vesper-start.log; then
            exit 1
          fi

name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format working copy
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy -p vesper-story -p vesper-cli -p vesper-game --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p vesper-story -p vesper-cli -p vesper-game
      - name: Validate example
        run: cargo run -p vesper-cli -- check game/scripts/demo.vn
      - name: Validate independent external games
        run: |
          cargo run -p vesper-cli -- check-game game
          cargo run -p vesper-cli -- check-game game-alternate
      - name: Reject malformed example with file and line
        run: |
          printf '@scene intro\nset x = invalid\n' > /tmp/vesper-invalid.vn
          if cargo run -p vesper-cli -- check /tmp/vesper-invalid.vn > /tmp/vesper-cli.log 2>&1; then
            echo 'invalid story unexpectedly passed'; exit 1
          fi
          grep -F '/tmp/vesper-invalid.vn:2:' /tmp/vesper-cli.log
      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 1
  bevy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo timeout 600s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          sudo timeout 600s apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev xvfb xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build Bevy 0.20 player
        run: cargo build -p vesper-player
      - name: Start player under virtual X11 display
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=TERM 25s xvfb-run -a target/debug/vesper-player game > /tmp/vesper-start.log 2>&1
          result=$?
          set -e
          cat /tmp/vesper-start.log
          if [ "$result" -ne 124 ]; then
            echo "Player did not stay running during smoke test (exit: $result)"
            exit 1
          fi
          if grep -Ei 'panicked at|thread .* panicked|Unable to find a GPU' /tmp/vesper-start.log; then
            exit 1
          fi
      - name: Verify keyboard dialogue and branching with screenshots
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/vesper-player game > /tmp/vesper-input.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            if [ -z "$win" ]; then
              cat /tmp/vesper-input.log
              echo "Player window was not found"
              exit 1
            fi
            sleep 5
            import -window "$win" /tmp/vesper-initial.png
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers space
            sleep 2
            import -window "$win" /tmp/vesper-choices.png
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers 1
            sleep 2
            import -window "$win" /tmp/vesper-after-choice.png
            for pair in "initial choices" "choices after-choice"; do
              read before after <<< "$pair"
              metric=$(compare -metric AE "/tmp/vesper-$before.png" "/tmp/vesper-$after.png" null: 2>&1 || true)
              echo "Changed pixels ($before -> $after): $metric"
              if [[ ! "$metric" =~ ^([0-9]+) ]] || [ "${BASH_REMATCH[1]:-0}" -lt 100 ]; then
                cat /tmp/vesper-input.log
                echo "Expected story input to change visible dialogue"
                exit 1
              fi
            done
            background_colors=$(convert /tmp/vesper-initial.png -crop 300x300+120+120 +repage -format "%k" info:)
            character_colors=$(convert /tmp/vesper-initial.png -crop 140x250+580+180 +repage -format "%k" info:)
            echo "Background crop colors: $background_colors; character crop colors: $character_colors"
            if [ "$background_colors" -lt 5 ] || [ "$character_colors" -lt 5 ]; then
              echo "Expected external background and character art to be visible"
              exit 1
            fi
            colors=$(identify -format "%k" /tmp/vesper-initial.png)
            echo "Initial rendered unique colors: $colors"
            if [ "$colors" -lt 12 ]; then
              echo "Expected images and text, but screenshot is nearly flat"
              exit 1
            fi
          '
      - name: Verify externally supplied TTF, responsive styling and multilingual text
        run: |
          cp -a game /tmp/vesper-typography
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("/tmp/vesper-typography")
          fonts = list(Path("/usr/share/fonts").rglob("*.ttf"))
          if not fonts:
              raise SystemExit("No system font on runner")
          dest = root / "assets/fonts/test.ttf"
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(fonts[0], dest)
          theme = root / "styles/dialogue.toml"
          content = theme.read_text()
          content = content.replace('family = "DejaVu Sans"', 'file = "assets/fonts/test.ttf"')
          content = content.replace('ui_scale = 1.0', 'ui_scale = 1.3')
          content = content.replace('size = 30.0', 'size = 34.0')
          theme.write_text(content)
          novel = root / "scripts/demo.vn"
          script = novel.read_text()
          script = script.replace('elena: "You\'re finally awake."',
              'elena: "日本語 مرحبا Привет — A fairly long line of multilingual dialogue with '
              'lots of additional words to ensure that wrapping works when the window is narrower."')
          novel.write_text(script)
          PY
          cargo run -p vesper-cli -- check-game /tmp/vesper-typography
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/vesper-player /tmp/vesper-typography > /tmp/vesper-typography.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            test -n "$win"
            sleep 8
            import -window "$win" /tmp/vesper-typography.png
            if grep -Ei "panicked at|failed to load|asset error" /tmp/vesper-typography.log; then
              cat /tmp/vesper-typography.log
              exit 1
            fi
            changed=$(compare -metric AE /tmp/vesper-initial.png /tmp/vesper-typography.png null: 2>&1 || true)
            echo "Themed screenshot changed pixels: $changed"
            pixels=$(printf "%s" "$changed" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            if [ -z "$pixels" ] || [ "$pixels" -lt 2000 ]; then
              cat /tmp/vesper-typography.log
              echo "External typography did not produce visible changes"
              exit 1
            fi
          '
      - name: Restore F5 save with F9 across process restart
        run: |
          mkdir -p /tmp/vesper-save-test
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            export VESPER_SAVE_DIR=/tmp/vesper-save-test
            target/debug/vesper-player game > /tmp/vesper-save.log 2>&1 &
            first=$!
            trap "kill $first 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            test -n "$win"
            sleep 5
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers space
            sleep 2
            xdotool key --clearmodifiers 1
            sleep 3
            import -window "$win" /tmp/vesper-saved.png
            xdotool key --clearmodifiers F5
            for attempt in $(seq 1 30); do
              if [ -s /tmp/vesper-save-test/vesper-demo.json ]; then break; fi
              sleep 1
            done
            test -s /tmp/vesper-save-test/vesper-demo.json
            kill "$first" || true
            wait "$first" || true
            target/debug/vesper-player game > /tmp/vesper-load.log 2>&1 &
            second=$!
            trap "kill $second 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            test -n "$win"
            sleep 5
            import -window "$win" /tmp/vesper-before-load.png
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers F9
            sleep 3
            import -window "$win" /tmp/vesper-restored.png
            grep -F "Vesper save restored" /tmp/vesper-load.log
            diff_before=$(compare -metric AE /tmp/vesper-before-load.png /tmp/vesper-restored.png null: 2>&1 || true)
            diff_saved=$(compare -metric AE /tmp/vesper-saved.png /tmp/vesper-restored.png null: 2>&1 || true)
            before=$(printf "%s" "$diff_before" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            saved=$(printf "%s" "$diff_saved" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            echo "Pre-load changed pixels: $before; saved-state mismatched pixels: $saved"
            if [ -z "$before" ] || [ "$before" -lt 1000 ] || [ -z "$saved" ] || [ "$saved" -gt 2000 ]; then
              cat /tmp/vesper-load.log
              echo "Save/load did not accurately restore displayed scene"
              exit 1
            fi
          '


name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format working copy
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy -p vesper-story -p vesper-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p vesper-story -p vesper-cli
      - name: Validate example
        run: cargo run -p vesper-cli -- check game/scripts/demo.vn
      - name: Reject malformed example with file and line
        run: |
          printf '@scene intro\nset x = invalid\n' > /tmp/vesper-invalid.vn
          if cargo run -p vesper-cli -- check /tmp/vesper-invalid.vn > /tmp/vesper-cli.log 2>&1; then
            echo 'invalid story unexpectedly passed'; exit 1
          fi
          grep -F '/tmp/vesper-invalid.vn:2:' /tmp/vesper-cli.log
  bevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - name: Check Bevy 0.20 player
        run: cargo check -p vesper-player

name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format working copy
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked -p vesper-story -p vesper-cli -p vesper-game --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p vesper-story -p vesper-cli -p vesper-game
      - name: Validate example
        run: cargo run --locked -p vesper-cli -- check game/scripts/demo.vn
      - name: Validate independent external games
        run: |
          cargo run --locked -p vesper-cli -- check-game game
          cargo run --locked -p vesper-cli -- check-game game-alternate
          cargo run --locked -p vesper-cli -- check-game examples/little-lantern
          cargo run --locked -p vesper-cli -- check-game examples/clockwork-moon
          cargo run --locked -p vesper-cli -- check-game examples/dawn-post-office
          cargo run --locked -p vesper-cli -- check-game examples/panel-showcase
          cargo run --locked -p vesper-cli -- check-game examples/inline-words
          cargo run --locked -p vesper-cli -- check-game examples/ambient-showcase
          cargo run --locked -p vesper-cli -- check-game examples/word-effects
          cargo run --locked -p vesper-cli -- check-game examples/moving-meadow
          cargo run --locked -p vesper-cli -- check-game examples/living-journal
          cargo run --locked -p vesper-cli -- check-game examples/atlas-unwritten-skies
      - name: Verify deterministic Atlas authoring compilation
        run: |
          python3 examples/atlas-unwritten-skies/tools/compile_story.py
          git diff --exit-code -- examples/atlas-unwritten-skies/scripts/story.vn
      - name: Verify all 23 original Dawn assets and their manifest hashes
        run: python3 .github/scripts/dawn_assets_check.py
      - name: Verify the external PCM audio assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import wave
          for filename in ("evening.wav", "greeting.wav"):
              with wave.open(str(Path("game/assets/audio") / filename), "rb") as wav:
                  assert wav.getnchannels() == 1
                  assert wav.getframerate() == 16000
                  assert wav.getsampwidth() == 2
                  assert wav.getnframes() > 1000
                  print(filename, "valid PCM frames:", wav.getnframes())
          PY
      - name: Reject malformed example with file and line
        run: |
          printf '@scene intro\nset x = invalid\n' > /tmp/vesper-invalid.vn
          if cargo run --locked -p vesper-cli -- check /tmp/vesper-invalid.vn > /tmp/vesper-cli.log 2>&1; then
            echo 'invalid story unexpectedly passed'; exit 1
          fi
          grep -F '/tmp/vesper-invalid.vn:2:' /tmp/vesper-cli.log
      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 1
  bevy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo timeout 600s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          sudo timeout 600s apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev xvfb xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build Bevy 0.20 player
        run: cargo build --locked -p vesper-player
      - name: Test fade interpolation
        run: cargo test --locked -p vesper-player --bin vesper-player
      - name: Play Atlas through all four original endings and test F5/F9
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/atlas_showcase_smoke.py
      - name: Preserve Atlas ending screenshots and native runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-atlas-showcase
          path: /tmp/vesper-atlas-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL05 dynamic word effects, high contrast and reduced motion
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/word_effects_smoke.py
      - name: Preserve QOL05 dynamic word screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-word-effects
          path: /tmp/vesper-word-effects-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL04 inline word styles at six sizes and high contrast
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/inline_spans_smoke.py
      - name: Preserve QOL04 inline typography screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-inline-spans
          path: /tmp/vesper-inline-spans-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL08 combined reader and author features in one game
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/integrated_authoring_smoke.py
      - name: Preserve QOL08 full example screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-integrated-qa
          path: /tmp/vesper-integrated-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL07 background walker, bird and plane paths across six sizes
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/ambient_motion_smoke.py
      - name: Verify QOL07 live motion removal, restart and invalid edit rejection
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/ambient_motion_reload_smoke.py
      - name: Preserve QOL07 motion hot reload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ambient-motion-reload
          path: /tmp/vesper-ambient-motion-reload-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve QOL07 motion start/mid/end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ambient-motion
          path: /tmp/vesper-ambient-motion-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL06 ambient scene actors across six windows and save/restore
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/ambient_actors_smoke.py
      - name: Preserve ambient actor sprite/screenshots evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ambient-actors
          path: /tmp/vesper-ambient-actors-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify ambient hot reload add, remove, reconfigure and invalid rejection
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/ambient_reload_smoke.py
      - name: Preserve ambient hot reload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ambient-reload
          path: /tmp/vesper-ambient-reload-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify QOL03 notebook/banner panels at six sizes, scene changes and high contrast
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/panel_skins_smoke.py
      - name: Preserve QOL03 diegetic panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-panel-skins
          path: /tmp/vesper-panel-skins-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify VX08 reading history and manual/quick save UI
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/history_saves_smoke.py
      - name: Preserve VX08 backlog and save-slot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-history-saves
          path: /tmp/vesper-history-saves-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify VX07 atmosphere presets and UI micro-interactions
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/atmosphere_smoke.py
      - name: Preserve VX07 atmospheric graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-atmosphere-feedback
          path: /tmp/vesper-atmosphere-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify authored character stage geometry, depth, expressions and reduced motion
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/actors_smoke.py
      - name: Preserve VX06 staged character screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-actor-staging
          path: /tmp/vesper-actors-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify authored cinematic background modes in both external games
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/cinematics_smoke.py
      - name: Preserve VX05 cinematic start/mid/end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-cinematic-backgrounds
          path: /tmp/vesper-cinematics-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Resize story across compact, widescreen and fullscreen windows
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/responsive_resize_smoke.py
      - name: Verify player preference overrides, fallback and legacy configuration
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/preferences_smoke.py
      - name: Exercise live player appearance settings and save/restart/reset
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/settings_smoke.py
      - name: Verify installed font search, preview, selection and restart persistence
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/font_browser_smoke.py
      - name: Preserve QOL01 font picker visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-font-browser
          path: /tmp/vesper-font-browser-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve live settings screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-live-settings
          path: /tmp/vesper-live-settings-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload player preferences screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-player-preferences
          path: /tmp/vesper-preferences-qa/*
          if-no-files-found: ignore
          retention-days: 10
      - name: Verify grapheme-safe text reveal, skip-once, reduced motion and opt-in auto
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/readout_smoke.py
      - name: Verify configurable auto-advance wait and live preference
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/auto_delay_smoke.py
      - name: Preserve QOL02 auto-delay visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-auto-delay
          path: /tmp/vesper-auto-delay-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve VX04 visual text pacing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-text-pacing
          path: /tmp/vesper-text-pacing-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify engine-owned choice rows, focus, save/restore and nine long options
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/choice_widgets_smoke.py
      - name: Preserve choice-row visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-choice-widgets
          path: /tmp/vesper-choice-widgets-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify dialogue layout at compact and standard sizes
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/dialogue_layout_smoke.py
      - name: Certify isolated body, option and hint glyph gaps at six window sizes
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 .github/scripts/hint_overlap_smoke.py
      - name: Preserve overlap regression screenshots and pixel masks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-hint-overlap
          path: /tmp/vesper-hint-overlap-qa/*
          if-no-files-found: ignore
          retention-days: 10
      - name: Preserve dialogue layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-dialogue-layout
          path: /tmp/vesper-layout-qa/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture responsive screenshots on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-responsive-resize
          path: /tmp/vesper-responsive-qa/*
          retention-days: 5
          if-no-files-found: ignore
      - name: Pause and resume story without consuming input
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/pause_smoke.py
      - name: Exercise main menu in both external stories
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/main_menu_smoke.py
      - name: Preserve structured pause and main menu screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-structured-menus
          path: /tmp/vesper-structured-menu-qa/**/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Restart completed fairy tale without exiting
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/end_replay_smoke.py
      - name: End-screen replay, main menu, quit and restored ending
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 .github/scripts/ending_navigation_smoke.py
      - name: Preserve ending navigation screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-ending-navigation
          path: /tmp/vesper-ending-qa/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Start player under virtual X11 display
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 timeout --signal=TERM 25s xvfb-run -a target/debug/vesper-player game > /tmp/vesper-start.log 2>&1
          result=$?
          set -e
          cat /tmp/vesper-start.log
          if [ "$result" -ne 124 ]; then
            echo "Player did not stay running during smoke test (exit: $result)"
            exit 1
          fi
          if grep -Ei 'panicked at|thread .* panicked|Unable to find a GPU' /tmp/vesper-start.log; then
            exit 1
          fi
      - name: Verify keyboard dialogue and branching with screenshots
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/vesper-player game > /tmp/vesper-input.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            if [ -z "$win" ]; then
              cat /tmp/vesper-input.log
              echo "Player window was not found"
              exit 1
            fi
            sleep 5
            grep -F "Vesper queued music: evening" /tmp/vesper-input.log
            grep -F "Vesper queued sound: greeting" /tmp/vesper-input.log
            grep -F "Vesper decoded audio asset: music:evening" /tmp/vesper-input.log
            grep -F "Vesper decoded audio asset: sound:greeting" /tmp/vesper-input.log
            grep -F "Vesper fade complete: Background: bedroom" /tmp/vesper-input.log
            grep -F "Vesper fade complete: Character: elena (happy)" /tmp/vesper-input.log
            import -window "$win" /tmp/vesper-initial.png
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers space
            sleep 2
            import -window "$win" /tmp/vesper-choices.png
            xdotool windowfocus --sync "$win"
            xdotool key --clearmodifiers Down
            sleep 2
            import -window "$win" /tmp/vesper-choice-down.png
            arrow_diff=$(compare -metric AE /tmp/vesper-choices.png /tmp/vesper-choice-down.png null: 2>&1 || true)
            echo "Arrow-selected choice changed pixels: $arrow_diff"
            arrow_pixels=$(printf "%s" "$arrow_diff" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            if [ -z "$arrow_pixels" ] || [ "$arrow_pixels" -lt 20 ]; then
              echo "ArrowDown did not move the visible selection"
              exit 1
            fi
            xdotool key --clearmodifiers Up
            sleep 1
            xdotool key --clearmodifiers 1
            sleep 2
            import -window "$win" /tmp/vesper-after-choice.png
            for pair in "initial choices" "choices after-choice"; do
              read before after <<< "$pair"
              metric=$(compare -metric AE "/tmp/vesper-$before.png" "/tmp/vesper-$after.png" null: 2>&1 || true)
              echo "Changed pixels ($before -> $after): $metric"
              if [[ ! "$metric" =~ ^([0-9]+) ]] || [ "${BASH_REMATCH[1]:-0}" -lt 100 ]; then
                cat /tmp/vesper-input.log
                echo "Expected story input to change visible dialogue"
                exit 1
              fi
            done
            background_colors=$(convert /tmp/vesper-initial.png -crop 300x300+120+120 +repage -format "%k" info:)
            character_colors=$(convert /tmp/vesper-initial.png -crop 140x250+580+180 +repage -format "%k" info:)
            echo "Background crop colors: $background_colors; character crop colors: $character_colors"
            if [ "$background_colors" -lt 5 ] || [ "$character_colors" -lt 5 ]; then
              echo "Expected external background and character art to be visible"
              exit 1
            fi
            colors=$(identify -format "%k" /tmp/vesper-initial.png)
            echo "Initial rendered unique colors: $colors"
            if [ "$colors" -lt 12 ]; then
              echo "Expected images and text, but screenshot is nearly flat"
              exit 1
            fi
          '
      - name: Verify actual sprite fade across frames
        run: |
          cp -a game /tmp/vesper-fade-test
          sed -i 's/fade_seconds = 0.25/fade_seconds = 3.0/' /tmp/vesper-fade-test/styles/dialogue.toml
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/vesper-player /tmp/vesper-fade-test > /tmp/vesper-fade.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            test -n "$win"
            import -window "$win" /tmp/vesper-fade-early.png
            sleep 4
            import -window "$win" /tmp/vesper-fade-late.png
            diff=$(compare -metric AE /tmp/vesper-fade-early.png /tmp/vesper-fade-late.png null: 2>&1 || true)
            pixels=$(printf "%s" "$diff" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            echo "Fade changed pixels over frames: $pixels"
            if [ -z "$pixels" ] || [ "$pixels" -lt 500 ]; then
              cat /tmp/vesper-fade.log
              echo "Expected active sprite fade to change visible pixels"
              exit 1
            fi
          '
      - name: Verify externally supplied TTF, responsive styling and multilingual text
        run: |
          cp -a game /tmp/vesper-typography
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("/tmp/vesper-typography")
          fonts = list(Path("/usr/share/fonts").rglob("*.ttf"))
          if not fonts:
              raise SystemExit("No system font on runner")
          dest = root / "assets/fonts/test.ttf"
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(fonts[0], dest)
          theme = root / "styles/dialogue.toml"
          content = theme.read_text()
          content = content.replace('family = "DejaVu Sans"', 'file = "assets/fonts/test.ttf"')
          content = content.replace('ui_scale = 1.0', 'ui_scale = 1.3')
          content = content.replace('size = 30.0', 'size = 34.0')
          theme.write_text(content)
          novel = root / "scripts/demo.vn"
          script = novel.read_text()
          script = script.replace('elena: "You\'re finally awake."',
              'elena: "日本語 مرحبا Привет — A fairly long line of multilingual dialogue with '
              'lots of additional words to ensure that wrapping works when the window is narrower."')
          novel.write_text(script)
          PY
          cargo run --locked -p vesper-cli -- check-game /tmp/vesper-typography
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail -c '
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/vesper-player /tmp/vesper-typography > /tmp/vesper-typography.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            win=""
            for attempt in $(seq 1 30); do
              win=$(xdotool search --name "Vesper Demonstration" | head -n 1 || true)
              if [ -n "$win" ]; then break; fi
              sleep 1
            done
            test -n "$win"
            sleep 8
            import -window "$win" /tmp/vesper-typography.png
            if grep -Ei "panicked at|failed to load|asset error" /tmp/vesper-typography.log; then
              cat /tmp/vesper-typography.log
              exit 1
            fi
            changed=$(compare -metric AE /tmp/vesper-initial.png /tmp/vesper-typography.png null: 2>&1 || true)
            echo "Themed screenshot changed pixels: $changed"
            pixels=$(printf "%s" "$changed" | sed -n "s/^\([0-9][0-9]*\).*/\1/p")
            if [ -z "$pixels" ] || [ "$pixels" -lt 2000 ]; then
              cat /tmp/vesper-typography.log
              echo "External typography did not produce visible changes"
              exit 1
            fi
          '
      - name: Verify compiler-free relocated Linux archive
        run: |
          bash -n packaging/linux.sh
          bash packaging/linux.sh target/debug/vesper-player /tmp/vesper-linux-x86_64.tar.gz
          mkdir -p /tmp/vesper-install
          tar -xzf /tmp/vesper-linux-x86_64.tar.gz -C /tmp/vesper-install
          test -x /tmp/vesper-install/vesper/vesper
          test -f /tmp/vesper-install/vesper/game/game.toml
          test -x /tmp/vesper-install/vesper/lantern
          test -x /tmp/vesper-install/vesper/moon
          test -x /tmp/vesper-install/vesper/dawn
          test -x /tmp/vesper-install/vesper/atlas
          test -f /tmp/vesper-install/vesper/examples/atlas-unwritten-skies/game.toml
          test -f /tmp/vesper-install/vesper/examples/atlas-unwritten-skies/scripts/story.vn
          test -f /tmp/vesper-install/vesper/examples/atlas-unwritten-skies/assets/backgrounds/observatory_evening.png
          test -f /tmp/vesper-install/vesper/examples/atlas-unwritten-skies/assets/audio/archive.wav
          test -f /tmp/vesper-install/vesper/examples/dawn-post-office/game.toml
          test -f /tmp/vesper-install/vesper/examples/dawn-post-office/assets/backgrounds/sorting-room.png
          test -f /tmp/vesper-install/vesper/examples/dawn-post-office/assets/characters/nima-hopeful.png
          test -f /tmp/vesper-install/vesper/examples/dawn-post-office/assets/audio/first-light.wav
          test -f /tmp/vesper-install/vesper/examples/little-lantern/game.toml
          test -f /tmp/vesper-install/vesper/examples/clockwork-moon/game.toml

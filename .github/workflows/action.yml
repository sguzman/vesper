name: Action prototype

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/action/**'
      - 'crates/action-demo/**'
      - 'examples/action-adventure/**'
      - '.github/workflows/action.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/action/**'
      - 'crates/action-demo/**'
      - 'examples/action-adventure/**'
      - '.github/workflows/action.yml'
  workflow_dispatch:

jobs:
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native Bevy and visual-smoke libraries
        run: |
          sudo timeout 600s apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          sudo timeout 600s apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config libwayland-dev libxkbcommon-dev \
            libfontconfig1-dev xvfb xauth xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers
      - name: Verify isolated action mechanics and source-art parser
        run: cargo test --locked -p vesper-action --lib
      - name: Verify standalone action executable
        run: cargo build --locked -p vesper-action-demo
      - name: Boot and capture real Bevy rendering, wide and tall
        run: bash .github/scripts/action_first_room_smoke.sh
      - name: Preserve action screenshots and boot log for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-action-first-room-evidence
          path: /tmp/vesper-action-qa/
          if-no-files-found: ignore
          retention-days: 14
